; Ajustes de producción para SIMCO.
; Los límites de subida deben ir por encima de los 25 MB que valida la
; aplicación (InputValidator::validateFiles y form-validation.js).

upload_max_filesize = 25M
post_max_size       = 30M
max_file_uploads    = 10
memory_limit        = 256M
max_execution_time  = 300
max_input_time      = 300

; Nunca mostrar errores al usuario; enviarlos al log del contenedor,
; que es lo que Render recoge.
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /dev/stderr
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT

expose_php = Off
date.timezone = America/Bogota

; El código lee las variables con $_ENV, así que PHP debe poblarlo.
variables_order = "EGPCS"

opcache.enable                  = 1
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files   = 10000
opcache.revalidate_freq         = 60
