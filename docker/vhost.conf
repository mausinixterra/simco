# Plantilla del VirtualHost: entrypoint.sh sustituye el marcador de puerto
# por el valor de PORT (Render lo inyecta) y escribe 000-default.conf.
ServerName simco
ServerTokens Prod
ServerSignature Off

<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/public_html

    # Logs a stdout/stderr para que Render los capture.
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # El symlink public_html/public_html existe solo para que PHP resuelva la
    # ruta relativa de los adjuntos. No debe servirse por web.
    <Location "/public_html">
        Require all denied
    </Location>

    # Los adjuntos son archivos que suben usuarios anónimos: nunca se ejecutan.
    <Directory /var/www/html/public_html/Anexos>
        php_flag engine off
        Options -Indexes -ExecCGI
        RemoveHandler .php .phtml .php3 .php4 .php5
        RemoveType .php .phtml .php3 .php4 .php5
    </Directory>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript text/plain
        AddOutputFilterByType DEFLATE application/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"
        ExpiresByType text/html "access plus 0 seconds"
    </IfModule>
</VirtualHost>
